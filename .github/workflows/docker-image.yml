name: Docker Image CI

on:
  push:
    branches: [master]
    paths:
      - 'initfs/**'
      - 'Dockerfile'
      - 'versions.env'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'initfs/**'
      - 'Dockerfile'
      - 'versions.env'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dailyhot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      front: ${{ steps.upstream.outputs.front }}
      api: ${{ steps.upstream.outputs.api }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream revisions
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/master && ("$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch) ]]; then
            ./scripts/update-upstream.sh
          fi
          . ./versions.env
          echo "front=$DAILYHOT_REF" >> "$GITHUB_OUTPUT"
          echo "api=$DAILYHOT_API_REF" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- versions.env; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Apply selected upstream revisions
        env:
          FRONT_REF: ${{ needs.prepare.outputs.front }}
          API_REF: ${{ needs.prepare.outputs.api }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRONT_REF" =~ ^[0-9a-f]{40}$ && "$API_REF" =~ ^[0-9a-f]{40}$ ]]
          printf 'DAILYHOT_REF=%s\nDAILYHOT_API_REF=%s\n' "$FRONT_REF" "$API_REF" > versions.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build native image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          load: true
          tags: dailyhot:test-${{ matrix.arch }}
          labels: |
            io.dailyhot.front.revision=${{ needs.prepare.outputs.front }}
            io.dailyhot.api.revision=${{ needs.prepare.outputs.api }}

      - name: Smoke test native image
        run: ./scripts/smoke-test.sh linux/${{ matrix.arch }} dailyhot:test-${{ matrix.arch }}

      - name: Save tested image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: docker save dailyhot:test-${{ matrix.arch }} | gzip -1 > dailyhot-${{ matrix.arch }}.tar.gz
        shell: bash

      - name: Upload tested image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dailyhot-${{ matrix.arch }}
          path: dailyhot-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  publish:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dailyhot-*
          path: images
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push tested images and publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          repository=rehiy/dailyhot
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for arch in amd64 arm64; do
            docker load --input "images/dailyhot-$arch.tar.gz"
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "dailyhot:test-$arch")" == "linux/$arch" ]]
            docker tag "dailyhot:test-$arch" "$repository:$tag-$arch"
            docker push "$repository:$tag-$arch"
          done
          docker buildx imagetools create \
            --tag "$repository:$tag" \
            --tag "$repository:latest" \
            "$repository:$tag-amd64" "$repository:$tag-arm64"
          docker buildx imagetools inspect "$repository:$tag"

  record-upstream:
    needs: [prepare, publish]
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Record successfully published revisions
        env:
          FRONT_REF: ${{ needs.prepare.outputs.front }}
          API_REF: ${{ needs.prepare.outputs.api }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRONT_REF" =~ ^[0-9a-f]{40}$ && "$API_REF" =~ ^[0-9a-f]{40}$ ]]
          printf 'DAILYHOT_REF=%s\nDAILYHOT_API_REF=%s\n' "$FRONT_REF" "$API_REF" > versions.env
          git config user.name "Sea"
          git config user.email "8297757+rehiy@users.noreply.github.com"
          git add versions.env
          if ! git diff --cached --quiet; then
            git commit -m "chore: update DailyHot upstream revisions"
            git push origin HEAD:refs/heads/master
          fi
